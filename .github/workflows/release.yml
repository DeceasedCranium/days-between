name: Build & Release

on:
  push:
    branches: [main]   # CI build on every push — artifacts only, no release
    tags:
      - 'v*'           # Full release build + publish when a vX.Y.Z tag is pushed

# Opt into Node.js 24 for action runners now, ahead of the June 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Pure-helper unit tests run first — fast, platform-independent.
  # Build + release jobs depend on this passing, so a regression in any
  # of the tested helpers blocks the matrix and prevents tagging a bad
  # release.
  test:
    name: Test (helpers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run helper tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build distributable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist/*.dmg
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.exe
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Days Between ${{ github.ref_name }}"
          generate_release_notes: false
          body: |
            ## Install

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` — open and drag to Applications |
            | Windows | `Days Between Setup …exe` (installer) or `Days Between …exe` (portable) |
            | Linux | `.AppImage` (`chmod +x` then run) or `.deb` (`sudo dpkg -i`) |

            > No Electron installation required — everything is bundled.

            ---

            See [README](https://github.com/DeceasedCranium/days-between#version-history) for full version history.
          files: artifacts/**/*
          fail_on_unmatched_files: false
