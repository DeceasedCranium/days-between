<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <!-- Cassette outline for tray — white, works on dark/light panels -->
  <!-- Housing -->
  <rect x="1" y="4" width="20" height="14" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
  <!-- Label area -->
  <rect x="3" y="5.5" width="16" height="5" rx="1" fill="white" opacity="0.15"/>
  <!-- Window -->
  <rect x="3" y="11" width="16" height="5.5" rx="1" fill="none" stroke="white" stroke-width="0.8" opacity="0.6"/>
  <!-- Left reel -->
  <circle cx="7.5" cy="13.5" r="2" fill="none" stroke="white" stroke-width="0.9"/>
  <circle cx="7.5" cy="13.5" r="0.7" fill="white"/>
  <!-- Right reel -->
  <circle cx="14.5" cy="13.5" r="2" fill="none" stroke="white" stroke-width="0.9"/>
  <circle cx="14.5" cy="13.5" r="0.7" fill="white"/>
  <!-- Tape path -->
  <path d="M9.5 12.5 Q11 11.5 12.5 12.5" stroke="white" stroke-width="0.8" fill="none" opacity="0.6"/>
</svg>
